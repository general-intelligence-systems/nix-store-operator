# Step 1: Build and generate store paths list
#
#   nix build nixpkgs#hello --print-out-paths
#   nix path-info -r nixpkgs#hello > store-paths.txt
#
# Step 2: Create the ConfigMap (name becomes the mount directory)
#
#   kubectl create configmap hello \
#     --from-file=paths=store-paths.txt \
#     -l nix-store-operator.ghcr.io/mount=true
#
# Step 3: Apply this deployment
#
# The store daemon will:
#   1. Fetch the listed store paths from the binary cache
#   2. Create /var/lib/nixfs/mounts/hello/ with hard links to only
#      the whitelisted paths — no other store paths are visible

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: hello
          image: busybox:latest
          command: ["/nix/store/dbghhbq1x39yxgkv3vkgfwbxrmw9nfzi-hello-2.12.1/bin/hello"]
          volumeMounts:
            - name: nix-store
              mountPath: /nix/store
              readOnly: true
      volumes:
        - name: nix-store
          hostPath:
            path: /var/lib/nixfs/mounts/hello
            type: Directory
