image:
  repository: ghcr.io/general-intelligence-systems/nix-store-operator
  tag: latest
  pullPolicy: IfNotPresent

storeRoot: /nix/store
hostStorePath: /var/lib/nixfs/store
mountsPath: /var/lib/nixfs/mounts
cacheUrl: https://cache.nixos.org

serviceAccount:
  name: store-daemon

namespace: nix-system
